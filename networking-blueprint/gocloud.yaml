# GoCloud CLI Configuration
# Generated by: gocloud configure
# 
# This file contains the configuration for your GoCloud infrastructure project.
# Customize the values below according to your needs.
#
# To generate your infrastructure:
#   gocloud generate --config gocloud.yaml
#

cli:
  working_dir: .
  auto_backup: true
  backup_dir: .gocloud-backups
  verbose: false
  debug: false
infrastructure:
  client: democorp.cloud
  company: dmc
  region: us-east-2
  version: 1.0.0
  # Optional: Use custom Git source instead of registry
  # source: "git@github.com:gocloudLa/terraform-aws-standard-platform.git"
  # source_ref: "feature/vpc-upgrade-peering"
  enable_secrets:  false
  metadata:
    public_domain: "democorp.cloud"
    private_domain: "democorp.private"
    internal_domain: "democorp.internal"
  backend:
    pattern: tf-backend
    region: us-east-2
    account: sha
    encrypt: true
  aws_sso:
    start_url: https://democorp-cloud.awsapps.com/start#/
    region: us-east-2
    role_name: Admin
  environments:
    sha:
      name: Shared
      aws_account: "112036182825"
      enable_sso: false
      layers:
        base: false
        foundation: false
    lv1:
      name: Lab VPC Net
      aws_account: "511192438786"
      layers:
        base: true
        foundation: false
    lv2:
      name: Lab VPC Ac1
      aws_account: "377730029539"
      layers:
        base: true
        foundation: false